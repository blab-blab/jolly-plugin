# Jolly config. Run /jolly reload after editing.
# Every way of earning jolliness has its own "enabled:" switch under "gains:".
config-version: 6

max-jolliness: 1000000
ignore-creative: true          # creative players earn nothing
require-hat: false             # true = jolliness only counts while the hat is worn. Buffs, ore duplication and cosmetics always need the hat.
give-hat-on-first-join: false

death:
  keep-jolliness: true         # false = dying resets jolliness to 0
  destroy-hat: false           # true = the hat is deleted from the death drops
  give-hat-on-respawn: false   # true = a new hat (at your current tier) comes back on respawn
  pvp:                         # one player killing another
    enabled: true              # false = normal death message and no penalty
    penalty: 250               # jolliness the KILLER loses
    # Placeholders: <killer> <victim> <method> <weapon> <points>
    message: "<red><killer> <method> <victim> using <weapon> and lost <points> jolliness points for being naughty.</red>"
    verbs: { melee: "slew", projectile: "shot", explosion: "blew up" }   # fills <method>

recipe:
  enabled: true
  discover-on-join: true
  shape: ["SWS", "RDR", "GEG"]
  ingredients:
    S: SNOW_BLOCK
    W: WHITE_WOOL
    R: RED_WOOL
    D: DIAMOND
    G: GOLD_INGOT
    E: EMERALD
  # A crafted hat always comes out at the crafter's current tier.

# MiniMessage. Placeholders: <name> <jolly> (points) <tier> (tier name, e.g. Rudolph) <tiernumber> <tiercolor>...</tiercolor>
tablist:
  enabled: true
  format: "<tiercolor>[<tier>]</tiercolor> <name>"

# Puts your tier name in front of your name in chat: <[Rudolph] Steve> hello
chat-prefix:
  enabled: true
  format: "<tiercolor>[<tier>]</tiercolor> "

# true  = 3D hat from the resource pack, drawn on the head (the item model is shown instead of the armor layer)
# false = plain red leather helmet look (no resource pack needed)
hat-display:
  enabled: true

# Natural ore you mine can drop a second copy of its drops. The chance depends on your tier
# (see "ore-duplicate-chance" in the tiers below) and needs the hat. Placed ore never counts.
ore-duplication:
  exclude: [ANCIENT_DEBRIS, NETHERITE_SCRAP]   # never duplicated (block or item names)

# Cosmetic particle styles, picked with /jolly particle <style>. Only shown while the hat is worn.
# Each number is the tier needed to unlock that style (0 = style disabled).
particles:
  default: snow                # style used until a player picks one ("none" = off until they choose)
  # Tier numbers used in the unlock settings: 1 Grinch, 2 Scrooge, 3 Frosty The Snowman, 4 Rudolph, 5 Elf, 6 Santa.
  unlock-tiers:
    snow: 2                    # snowflake trail while moving
    snow_glow: 3               # snowflakes + glowing motes; shimmers when standing still
    candy_cane: 3              # red and white trail
    holly: 4                   # red and green trail
    snow_aura: 4               # snowflakes orbiting you
    starlight: 5               # sparkles rising around you
    aurora: 5                  # colour-shifting halo above your head
    crown: 6                   # frost crown

jingle:                        # quiet bell while walking, toggled with /jolly jingle [on|off]
  enabled: true
  unlock-tier: 3
  default-on: false
  sound: "minecraft:block.note_block.chime"
  volume: 0.25

cheer:                         # /jolly cheer: a burst of festive particles (hat required)
  enabled: true
  cooldown-seconds: 30
  radius: 24                   # who sees the message
  message: "<tiercolor><player> cheers!</tiercolor>"

snowballs:                     # snowball perks (hat required)
  candy-cane:
    enabled: true              # thrown snowballs leave a red and white trail
    unlock-tier: 2
  knockback:
    enabled: true              # snowballs push other players back, no damage
    unlock-tier: 3
    strength: 0.5
    lift: 0.25

tier-up-burst:
  enabled: true                # particle burst + twinkle where a player reaches a new tier

sounds:
  gain:                        # played to the player whenever they gain jolliness
    enabled: true
    sound: "minecraft:block.amethyst_block.chime"
    volume: 0.5
    pitch: 1.6
    min-gap-ticks: 8           # so walking/mining doesn't stack the sound
  tier-up:
    enabled: true
    sound: "minecraft:ui.toast.challenge_complete"
    volume: 1.0
    pitch: 1.0
    everyone: true             # false = only the player who tiered up hears it

announce:
  enabled: true                # server-wide message when someone tiers up
  message: "<gold><player> reached the <tiercolor><tier></tiercolor> tier!</gold>"

gains:
  walking:
    enabled: true
    blocks-per-point: 10
    points: 1
    snow-multiplier: 2.0
    snow-biomes: [snowy_plains, snowy_taiga, snowy_beach, snowy_slopes, frozen_peaks, jagged_peaks, grove, ice_spikes, frozen_river, frozen_ocean, deep_frozen_ocean]
  mining:
    enabled: true
    points:       # naturally generated ore only (player-placed ore is ignored)
      COAL_ORE: 1
      DEEPSLATE_COAL_ORE: 1
      COPPER_ORE: 1
      DEEPSLATE_COPPER_ORE: 1
      IRON_ORE: 2
      DEEPSLATE_IRON_ORE: 2
      GOLD_ORE: 2
      DEEPSLATE_GOLD_ORE: 2
      NETHER_GOLD_ORE: 1
      REDSTONE_ORE: 2
      DEEPSLATE_REDSTONE_ORE: 2
      LAPIS_ORE: 2
      DEEPSLATE_LAPIS_ORE: 2
      NETHER_QUARTZ_ORE: 1
      DIAMOND_ORE: 5
      DEEPSLATE_DIAMOND_ORE: 5
      EMERALD_ORE: 5
      DEEPSLATE_EMERALD_ORE: 5
      ANCIENT_DEBRIS: 10
  placing-rare:
    enabled: true
    once-per-position: true    # breaking and re-placing the same spot doesn't pay again
    points:
      BEACON: 10
      CONDUIT: 8
      NETHERITE_BLOCK: 8
      DIAMOND_BLOCK: 5
      EMERALD_BLOCK: 5
      GOLD_BLOCK: 3
      LODESTONE: 4
      RESPAWN_ANCHOR: 4
      ENCHANTING_TABLE: 3
      ENDER_CHEST: 2
      DRAGON_EGG: 15
  decorating:
    enabled: true              # festive blocks; same once-per-position rule as above
    points:
      SPRUCE_SAPLING: 1
      RED_CANDLE: 1
      GREEN_CANDLE: 1
      WHITE_CANDLE: 1
      LANTERN: 1
      SOUL_LANTERN: 1
      CAKE: 2
  breeding:
    enabled: true
    points: 3
    cooldown-seconds: 2
  snowballs:
    enabled: true              # hit another creature with a snowball
    points: 1
    cooldown-seconds: 3
  trading:
    enabled: true              # complete a villager trade
    points: 2
    cooldown-seconds: 5
  festive-food:
    enabled: true
    cooldown-seconds: 10
    points:
      COOKIE: 1
      PUMPKIN_PIE: 2
      HONEY_BOTTLE: 1
      SWEET_BERRIES: 1
  fishing:
    enabled: true
    points: 1
  advancements:
    enabled: true              # any advancement with a visible toast (not recipes)
    points: 5
  playtime:
    enabled: true
    minutes: 5                 # every N minutes with the hat on
    points: 1
  passive:
    enabled: true
    seconds: 60                # every N seconds online
    points: 1
  ice-boating:
    enabled: true
    multiplier: 2.0            # x the walking rate while boating over ice
    blocks: [ICE, PACKED_ICE, BLUE_ICE, FROSTED_ICE]
  snowmen:
    enabled: true              # building a snow golem (placing the pumpkin yourself; dispensers don't count)
    points: 20
    cooldown-seconds: 60
  bells:
    enabled: true              # ringing a bell
    points: 5
    cooldown-seconds: 60
  music-discs:                 # the FIRST time each disc enters your inventory (loot chest, drop, ground...)
    enabled: true
    points:
      MUSIC_DISC_13: 50
      MUSIC_DISC_CAT: 50
      MUSIC_DISC_BLOCKS: 50
      MUSIC_DISC_CHIRP: 50
      MUSIC_DISC_FAR: 50
      MUSIC_DISC_MALL: 50
      MUSIC_DISC_MELLOHI: 50
      MUSIC_DISC_STAL: 50
      MUSIC_DISC_STRAD: 50
      MUSIC_DISC_WARD: 50
      MUSIC_DISC_11: 50
      MUSIC_DISC_WAIT: 50
      MUSIC_DISC_OTHERSIDE: 250
      MUSIC_DISC_5: 250
      MUSIC_DISC_PIGSTEP: 250
      MUSIC_DISC_RELIC: 250
      MUSIC_DISC_CREATOR: 250
      MUSIC_DISC_CREATOR_MUSIC_BOX: 250
      MUSIC_DISC_PRECIPICE: 250
  mob-kills:
    enabled: false             # off by default: mob farms make it easy to inflate
    points: 1                  # any hostile mob
    boss-points:
      ENDER_DRAGON: 25
      WITHER: 25
      WARDEN: 25
      ELDER_GUARDIAN: 10
  gifting:
    enabled: true
    points: 3                  # awarded to the giver when someone picks up their dropped item
    pair-cooldown-seconds: 300
  chat:
    enabled: true
    points: 5
    cooldown-seconds: 60
    phrases: ["merry christmas", "happy holidays", "ho ho ho"]

# Each tier's name is its key below ("Grinch", "Scrooge", ...). Rename a key to rename the tier.
# Tier colors ("color") are used for the pom pom in chat/tab/announcements and the tier-up burst.
# The in-game pom pom tint comes from the resource pack (assets/jolly/items/santa_hat_<tier>.json).
# Tier 1 gray, 2 green, 3 blue, 4 purple, 5 yellow, 6 red (max).
# armor/toughness are the helmet's TOTAL values (leather helmet = 1 armor, diamond = 3 armor + 2 toughness).
# effects: vanilla effect id -> amplifier (0 = level I, 1 = level II). Effects stack upward through tiers.
# ore-duplicate-chance: 0.05 = 5% chance that a natural ore you mine drops a second copy of its drops.
# Frost resistance is built in: the hat is a leather helmet, so powder snow never freezes the wearer.
tiers:
  "1":
    threshold: 0
    color: "#9E9E9E"
    max-durability: 55
    armor: 1.0
    toughness: 0.0
    unbreaking: 0
    glint: false
    effects: {}
    ore-duplicate-chance: 0.0
  "2":
    threshold: 2000
    color: "#3DD13D"
    max-durability: 120
    armor: 1.5
    toughness: 0.5
    unbreaking: 1
    glint: false
    effects: { speed: 1 }
    ore-duplicate-chance: 0.0
  "3":
    threshold: 5000
    color: "#3D7BFF"
    max-durability: 200
    armor: 2.0
    toughness: 1.0
    unbreaking: 2
    glint: false
    effects: { luck: 0 }
    ore-duplicate-chance: 0.02
  "4":
    threshold: 10000
    color: "#A43DFF"
    max-durability: 280
    armor: 2.5
    toughness: 1.5
    unbreaking: 3
    glint: false
    effects: { hero_of_the_village: 0 }
    ore-duplicate-chance: 0.04
  "5":
    threshold: 20000
    color: "#FFD92E"
    max-durability: 363
    armor: 3.0
    toughness: 2.0
    unbreaking: 3
    glint: true
    effects: { regeneration: 0 }
    ore-duplicate-chance: 0.07
  "6":
    threshold: 50000
    color: "#FF3030"
    max-durability: 407
    armor: 3.0
    toughness: 3.0
    unbreaking: 3
    glint: true
    effects: {}
    ore-duplicate-chance: 0.10
